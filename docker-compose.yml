version: "3.9"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Default: SQLite persisted on the backend_db volume (zero extra setup).
      # To use Postgres instead: run `docker compose --profile postgres up`
      # and set DATABASE_URL: postgresql://docurag:docurag@postgres:5432/docurag
      DATABASE_URL: sqlite:////app/data/docurag.db
      PYTHONUNBUFFERED: "1"
    volumes:
      # Persist uploads, the vector DB, and (if using SQLite) the app DB
      # across container restarts.
      - backend_storage:/app/storage
      - backend_db:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Optional: swap SQLite for Postgres by setting DATABASE_URL above and
  # uncommenting `depends_on: postgres` in the backend service.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docurag
      POSTGRES_PASSWORD: docurag
      POSTGRES_DB: docurag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docurag"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - postgres

volumes:
  backend_storage:
  backend_db:
  postgres_data:
